name: Deploy to droplet

# 客户自有服务器（DigitalOcean）的部署链路。
#
# ⛔ 2026-08-05 起这是**唯一的自动部署链路**。deploy.yml（Cloud Run）已降为仅手动，
#    只作为回滚窗口内的退路保留。
#
# paths 过滤与 deploy.yml 原先保持一致：只有会进 Docker 镜像 / 影响构建部署的路径变化
# 才触发，docs/*.md 这类纯文档改动不触发（对照 .dockerignore 反推，两边要一致）。
#
# ⛔ 不在 2 vCPU 的服务器上构建镜像（会拖垮同机 PostgreSQL）。构建在 runner 上做，
#    服务器只负责 pull + up。

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "prisma/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "sentry.*.config.ts"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - "deploy/droplet/**"
      - ".github/workflows/deploy-droplet.yml"
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: '跳过 prisma migrate deploy（仅在确认无新迁移时用）'
        type: boolean
        default: false

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 运行时镜像（Next standalone + chromium + 中文字体 + postgresql17-client）
      - name: Build & push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 迁移镜像：运行时镜像不含 prisma CLI，迁移不能建立在"npm registry 此刻可达"上
      - name: Build & push migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}-migrator:${{ github.sha }}
            ${{ env.IMAGE }}-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 固定主机密钥，不用 StrictHostKeyChecking=no —— 那等于每次部署都接受任意中间人
          printf '%s\n' "${{ secrets.DROPLET_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 编排文件与部署脚本跟着代码走。不同步的话，改了仓库里的 compose 而服务器上
      # 还是旧的，表现是「明明改好了却没生效」，且没有任何报错提示你去看那个文件。
      # /opt/veggie 属主是 deploy，直接 scp 即可，不需要 sudo。
      - name: Sync deploy files
        env:
          HOST: ${{ vars.DROPLET_HOST }}
          PORT: ${{ vars.DROPLET_PORT }}
          USER_NAME: ${{ vars.DROPLET_USER }}
        run: |
          set -euo pipefail
          scp -P "$PORT" \
              deploy/droplet/docker-compose.yml \
              deploy/droplet/healthcheck.sh \
              deploy/droplet/remote-deploy.sh \
              "$USER_NAME@$HOST:/opt/veggie/"
          ssh -p "$PORT" "$USER_NAME@$HOST" 'chmod 755 /opt/veggie/healthcheck.sh /opt/veggie/remote-deploy.sh'

      # ⛔ 部署脚本必须是服务器上的**文件**，不能用 `ssh host bash -s <<EOF` 把脚本
      #    从 stdin 喂进去 —— `docker compose run` 会接管 stdin 并把脚本剩下的部分
      #    整段吃掉，导致 migrate 之后的 up -d / healthcheck 全不执行，而工作流
      #    照样报成功。2026-08-05 首次部署实测踩到，见 remote-deploy.sh 文件头。
      #    GHCR token 走 stdin，不进命令行，避免出现在服务器的 ps 输出里。
      - name: Deploy
        env:
          HOST: ${{ vars.DROPLET_HOST }}
          PORT: ${{ vars.DROPLET_PORT }}
          USER_NAME: ${{ vars.DROPLET_USER }}
          TAG: ${{ github.sha }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh -p "$PORT" "$USER_NAME@$HOST" \
            "TAG='$TAG' SKIP_MIGRATE='$SKIP_MIGRATE' GHCR_USER='$GHCR_USER' bash /opt/veggie/remote-deploy.sh"

      - name: Deployed image
        if: success()
        run: echo "✅ ${{ env.IMAGE }}:${{ github.sha }}"
