name: Deploy to Cloud Run

# ⛔ 2026-08-05 起：**仅手动触发**。自动部署已交给 deploy-droplet.yml（客户自有服务器）。
#
# 为什么保留这个工作流而不是删掉：它是回滚窗口内唯一的退路 —— 万一 droplet 出问题，
# 还能手动把 Cloud Run 部署回来并把入口指回去。等观察期结束、确认不再需要回滚，
# 连同 Cloud Run 服务与 Neon 一起清理（顺序见 docs/20260805-migration-tasks.md）。
#
# ⚠️ 连带后果，别忘：从这一刻起新的 Prisma 迁移**只会打到 droplet 的库**，
#    Neon 的 schema 停在 2026-08-05。所以切流量那天从 Neon 重做 dump 恢复到 droplet 之后，
#    **必须再跑一次 `prisma migrate deploy`** 把落后的迁移补上，否则 schema 会被 dump 倒退。
on:
  workflow_dispatch:

# 同一时刻只跑一次部署，新推送取消正在进行的旧部署。
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # Workload Identity 联合换取 OIDC token 所需

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # 复用现有 cloudbuild.yaml：Cloud Build 内构建镜像 + 推送 + 部署到 Cloud Run
      # （含 min-instances=0 等配置，密钥由 Secret Manager 注入，仓库内不存任何凭据）
      - name: Build & Deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project="${{ vars.GCP_PROJECT_ID }}"

      - name: Show deployed URL
        run: |
          gcloud run services describe veggie \
            --region=europe-west1 \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)'
