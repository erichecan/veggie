steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/veggie:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/veggie:latest'
      - '.'

  # 推送镜像到 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/veggie']

  # 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'veggie'
      - '--image=gcr.io/$PROJECT_ID/veggie:$BUILD_ID'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--cpu-boost'
      - '--set-secrets=DATABASE_URL=VEGGIE_DATABASE_URL:latest,JWT_SECRET=VEGGIE_JWT_SECRET:latest,RESEND_API_KEY=VEGGIE_RESEND_API_KEY:latest,NEXT_PUBLIC_SENTRY_DSN=VEGGIE_SENTRY_DSN:latest'
      - '--set-env-vars=GCS_BUCKET_NAME=veggie-supply-images'

images:
  - 'gcr.io/$PROJECT_ID/veggie'

options:
  logging: CLOUD_LOGGING_ONLY
