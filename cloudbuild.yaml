steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/veggie:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/veggie:latest'
      - '.'

  # 推送镜像到 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/veggie']

  # 迁移生产库（在部署新镜像之前）：从 Secret Manager 取生产库连接串跑 prisma migrate deploy。
  # 幂等；失败则 set -e 中止整个部署，避免"镜像 client 期望新列、生产库还没列"的 ColumnNotFound 500。
  # 加列这类增量变更"先迁移后部署"是安全顺序（旧代码对多出的可空列前向兼容）。
  # ⚠️ 迁移必须用 Neon 的 direct(非池化)连接:pooler(pgbouncer 事务模式)不支持 migrate 需要的
  #    会话级 pg_advisory_lock,会 P1002 超时甚至把锁泄漏在复用连接上。去掉 host 里的 -pooler 即为
  #    direct 端点(真实 1:1 会话,断开即释放锁)。app 运行时仍用 pooler 串(Cloud Run 的 --set-secrets)。
  - name: 'node:20'
    id: migrate-prod-db
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm ci --prefer-offline --no-audit
        # $$ 转义:让 Cloud Build 把字面量 ${...} 传给 bash(而非当作替换变量),bash 再对 secretEnv 注入的 DATABASE_URL 做去 -pooler 展开
        export DATABASE_URL="$${DATABASE_URL/-pooler/}"
        npx prisma migrate deploy
    secretEnv: ['DATABASE_URL']

  # 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'veggie'
      - '--image=gcr.io/$PROJECT_ID/veggie:$BUILD_ID'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--cpu-boost'
      - '--set-secrets=DATABASE_URL=VEGGIE_DATABASE_URL:latest,JWT_SECRET=VEGGIE_JWT_SECRET:latest,RESEND_API_KEY=VEGGIE_RESEND_API_KEY:latest,NEXT_PUBLIC_SENTRY_DSN=VEGGIE_SENTRY_DSN:latest'
      - '--set-env-vars=GCS_BUCKET_NAME=veggie-supply-images'

images:
  - 'gcr.io/$PROJECT_ID/veggie'

# 迁移步骤用的生产库连接串（与 Cloud Run 运行时同一个 secret）
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VEGGIE_DATABASE_URL/versions/latest
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
