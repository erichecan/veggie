<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DraftRestoreBanner 预览</title>
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
</head>
<body class="bg-gray-50 p-6">
  <div class="mx-auto max-w-3xl">
    <h1 class="mb-3 text-lg font-semibold text-gray-900">订单编辑页（示意）</h1>

    <!-- 这就是 DraftRestoreBanner 的真实 className，照搬组件源码，不是另画的草图 -->
    <div class="mb-3 flex items-center justify-between gap-3 rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900">
      <span>检测到上次未保存的内容，是否恢复？</span>
      <div class="flex shrink-0 gap-2">
        <button class="inline-flex h-7 items-center rounded-lg border border-gray-300 bg-white px-2.5 text-[0.8rem] font-medium hover:bg-gray-50">丢弃</button>
        <button class="inline-flex h-7 items-center rounded-lg bg-[#875A7B] px-2.5 text-[0.8rem] font-medium text-white hover:bg-[#6d4963]">恢复</button>
      </div>
    </div>

    <div class="rounded-lg border border-gray-200 bg-white p-4 text-sm text-gray-500">
      下面是页面原有表单内容（客户 / 商品行 / 数量……），条状提示只占顶部一行，
      不遮挡下面的保存按钮。
    </div>
  </div>
</body>
</html>
