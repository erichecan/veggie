# /etc/nginx/sites-available/veggie
#
# B1（子域名 + DNS）到位后：把 server_name 改成真实域名，再跑
#   sudo certbot --nginx -d <域名>
# certbot 会自己往这里插 443 的 listen 与证书路径。

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 20m;          # 采购单 PDF 上限 15MB，留余量

  # ── 压缩 ───────────────────────────────────────────────────────────────────
  # ⛔ 发行版默认配置里 `gzip on` 是开着的，但 gzip_types 被注释掉（默认只压 text/html），
  #    且 gzip_proxied 默认是 off —— 本站所有内容都来自反向代理，两个原因叠加等于完全没压缩。
  #    实测：/api/products 裸传 3.5 MB。JSON 压缩比约 10:1，这是本站最大的一块优化。
  gzip on;
  gzip_vary on;
  gzip_proxied any;                  # ← 不加这条，反代来的响应一律不压
  gzip_comp_level 5;                 # 机器只有 2 vCPU 且已是 CPU 瓶颈，不用 9
  gzip_min_length 1024;              # 小响应压了反而更慢
  gzip_types
    application/json
    application/javascript
    text/javascript
    text/css
    text/plain
    text/xml
    application/xml
    application/rss+xml
    image/svg+xml;

  # ── Next.js 构建产物 ───────────────────────────────────────────────────────
  # 文件名自带内容哈希，可以放心 immutable。让 Nginx 直接回 304 / 走浏览器缓存，
  # 省掉 Node 处理这些请求的 CPU —— 在 2 vCPU 上这部分不便宜。
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # 上传文件由 Nginx 直出，不经 Node（设计 §2.3）
  location /uploads/ {
    alias /data/veggie/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;           # 服务端 Chromium 渲染 PDF 可能较慢
  }
}
