# TLS 参数 —— 两个 443 server 块共用，改一处即可
#
# 没有用 certbot 的 options-ssl-nginx.conf：那份是 nginx 插件包带的，
# 本机走的是 certonly + 手写配置，所以参数写在这里。
#
# 不设 ssl_dhparam：只启用 ECDHE 套件，DHE 一个都没开，dhparam 用不上。
# 不开 OCSP stapling：Let's Encrypt 已停止提供 OCSP 响应，开了只会在日志里报错。

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;          # TLS1.3 下由客户端选更合适
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# 这台机器只有 2 vCPU，握手是实打实的 CPU 开销：会话复用要开。
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
